# Build the Aldelo → Convex sync service for Windows (for use with NSSM on the POS machine).
# Run on Windows so the binary links against ODBC; download the artifact and copy to your POS machine.

name: Build Windows sync service

on:
  push:
    branches: [main, master]
    paths:
      - 'sync_service/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'sync_service/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sync_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspace: sync_service

      - name: Build release (64-bit)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build release (32-bit)
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: aldelo-convex-sync-windows-x64
          path: sync_service/target/x86_64-pc-windows-msvc/release/aldelo-convex-sync.exe

      - name: Upload Windows x86 executable
        uses: actions/upload-artifact@v4
        with:
          name: aldelo-convex-sync-windows-x86
          path: sync_service/target/i686-pc-windows-msvc/release/aldelo-convex-sync.exe
