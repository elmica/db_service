# Validate and build the Aldelo → Convex sync service (Python).
# Builds a Windows .exe for use with NSSM on the POS machine.

name: Sync service (Python)

on:
  push:
    branches: [main, master]
    paths:
      - 'sync_service/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'sync_service/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (requests, tomli for Python < 3.11)
        run: pip install requests tomli

      - name: Validate syntax
        run: python -m py_compile aldelo_convex_sync.py

  build:
    runs-on: windows-latest
    needs: validate
    defaults:
      run:
        working-directory: sync_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller aldelo_convex_sync.spec

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: aldelo-convex-sync-windows
          path: sync_service/dist/aldelo-convex-sync.exe
